name: Build APK

on:
  push:
    branches-ignore: [ci-log]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Caused by|requires|Dependency|minSdk|compileSdk|Android Gradle|AAPT|resource .* not found|FAILED" build.log | grep -v "^> Task" | head -40 > errs.txt || true
          [ -s errs.txt ] || tail -50 build.log > errs.txt
          {
            echo "Commit ${GITHUB_SHA}"
            echo '```'
            cut -c1-400 errs.txt
            echo '```'
          } > errs.md
          n=$(gh issue list --state open --search "Build errors in:title" --json number --jq '.[0].number' || true)
          if [ -z "$n" ]; then
            gh issue create --title "Build errors" --body-file errs.md
          else
            gh issue comment "$n" --body-file errs.md
          fi

      - name: Close stale build-error issues
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Build errors in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed --comment "Fixed: build for ${GITHUB_SHA::7} succeeded."
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk StreamLite.apk

      - name: Prepare release notes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          {
            awk -v v="$ver" '$0 ~ "^## "v"$" {f=1; next} /^## /{f=0} f' CHANGELOG.md
            echo
            echo "**Install:** download \`StreamLite.apk\` below and open it (Android 6.0+). Builds are signed with the same key, so they update over older ones."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > notes.md

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: StreamLite v${{ env.VERSION }}
          body_path: notes.md
          files: StreamLite.apk
          make_latest: true

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci
          {
            echo "sha: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "result: ${{ job.status }}"
          } > /tmp/ci/status.txt
          [ -f errs.txt ] && cp errs.txt /tmp/ci/errors.txt || true
          [ -f build.log ] && tail -120 build.log | cut -c1-300 > /tmp/ci/log-tail.txt || true
          cd /tmp/ci
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_RUN_NUMBER} ${GITHUB_REF_NAME}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-log || true
