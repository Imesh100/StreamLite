name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Caused by|requires|Dependency|minSdk|compileSdk|Android Gradle|AAPT|resource .* not found|FAILED" build.log | grep -v "^> Task" | head -40 > errs.txt || true
          [ -s errs.txt ] || tail -50 build.log > errs.txt
          {
            echo "Available ffmpeg decoder versions:"
            curl -sS --max-time 20 https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tr '\n' ' ' || true
            echo
            echo "Commit ${GITHUB_SHA}"
            echo '```'
            cut -c1-400 errs.txt
            echo '```'
          } > errs.md
          n=$(gh issue list --state open --search "Build errors in:title" --json number --jq '.[0].number' || true)
          if [ -z "$n" ]; then
            gh issue create --title "Build errors" --body-file errs.md
          else
            gh issue comment "$n" --body-file errs.md
          fi

      - name: Close stale build-error issues
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Build errors in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed --comment "Fixed: build for ${GITHUB_SHA::7} succeeded."
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk StreamLite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamLite-apk-${{ github.ref_name }}
          path: StreamLite.apk

      - name: Prepare release notes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          {
            awk -v v="$ver" '$0 ~ "^## "v"$" {f=1; next} /^## /{f=0} f' CHANGELOG.md
            echo
            echo "**Install:** download \`StreamLite.apk\` below and open it (Android 5.0+). Builds are signed with the same key, so they update over older ones."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > notes.md

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamLite v${{ env.VERSION }} (build ${{ github.run_number }})
          body_path: notes.md
          files: StreamLite.apk

      - name: Fix titles and notes of earlier releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fix() {  # tag version
            gh release view "$1" >/dev/null 2>&1 || return 0
            awk -v v="$2" '$0 ~ "^## "v"$" {f=1; next} /^## /{f=0} f' CHANGELOG.md > old.md
            printf '\nDownload `StreamLite.apk` below. Older build, see the [latest release](https://github.com/%s/releases/latest) for the newest version.\n' "$GITHUB_REPOSITORY" >> old.md
            gh release edit "$1" --title "StreamLite v$2 (build ${1#build-})" --notes-file old.md --latest=false
          }
          fix build-1 1.0
          fix build-2 2.0
          fix build-3 2.1
          fix build-6 2.2
