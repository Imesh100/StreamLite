name: Bug report
description: Something doesn't play or work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? (black screen, no sound, stutter, crash…)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps / sample link
      description: Link type (direct, HLS, DASH…) and codecs if you know them. Remove any private tokens.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. MediaTek Smart TV, Android 9"
  - type: textarea
    id: report
    attributes:
      label: Debug report
      description: In the app, Settings → Copy debug report, then paste here.
      render: text
